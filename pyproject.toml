[project]
name = "ledger-agent"
version = "0.1.0"
description = "Evidence-grounded answers from SEC 10-K filings"
readme = "README.md"
authors = [
    { name = "Devashish Bhat", email = "devashishbhat11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "langgraph>=1.2.12",
    "lxml>=6.1.3",
    "mcp[cli]>=2.2.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]